<style>

<!-- Monitor Item -->

<div class="w-20 h-14 bg-workplace-blue flex items-center justify-center">
<span class="material-symbols-outlined text-paper-white text-3xl">terminal</span>
</div>
</div>
<!-- Plant Item -->
<div class="absolute top-24 right-12 w-12 h-16">
<div class="w-8 h-8 bg-tertiary absolute bottom-0 left-2"></div>
<div class="w-12 h-12 bg-pixel-green rounded-full absolute -top-4 left-0 border-2 border-ink-black"></div>
</div>

<!-- Floating Action Button -->
<button class="fixed bottom-24 right-[calc(50%-220px)] w-14 h-14 bg-primary text-on-primary border-pixel-border-md border-ink-black shadow-[4px_4px_0px_0px_rgba(27,42,65,1)] flex items-center justify-center active:translate-x-px-unit active:translate-y-px-unit active:shadow-none transition-all z-40">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<script>
        // Simple micro-interaction for item hovering
        document.querySelectorAll('.aspect-square').forEach(item => {
            item.addEventListener('mouseenter', () => {
                item.classList.add('translate-y-[-2px]');
            });
            item.addEventListener('mouseleave', () => {
                item.classList.remove('translate-y-[-2px]');
            });
        });

        // Background parallax effect simulation on mouse move for the desk
        const desk = document.querySelector('section');
        desk.addEventListener('mousemove', (e) => {
            const rect = desk.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            
            const char = desk.querySelector('.animate-bounce');
            char.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        });
    </script>
